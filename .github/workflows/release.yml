name: Test, Package and Release App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify version contract
        id: version
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const manifest = JSON.parse(fs.readFileSync('manifest.json'));
          const pkg = JSON.parse(fs.readFileSync('package.json'));
          assert.equal(pkg.version, manifest.version);
          assert.match(pkg.version, /^\d+\.\d+\.\d+$/);
          const tag = `v${pkg.version}`;
          if (process.env.GITHUB_REF_TYPE === 'tag') assert.equal(process.env.GITHUB_REF_NAME, tag);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\narchive=token-tracker-${tag}.zip\n`);
          JS
      - name: Run tests
        run: npm test
      - name: Package tracked source only
        env:
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          mkdir -p dist
          git archive --format=zip --output="dist/$ARCHIVE" HEAD
          (cd dist && sha256sum "$ARCHIVE" > "$ARCHIVE.sha256")
      - name: Verify clean release archive
        env:
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          VERIFY_DIR=$(mktemp -d)
          unzip -q "dist/$ARCHIVE" -d "$VERIFY_DIR"
          (cd "$VERIFY_DIR" && npm test)
          rm -rf "$VERIFY_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: token-tracker-${{ steps.version.outputs.tag }}
          path: dist/*
          if-no-files-found: error
      - name: Publish stable release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: Token Tracker ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
